<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>{{ t('brand.name') }} — {{ t('brand.tagline') }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#059669', dark: '#047857', 50: '#ecfdf5', 100: '#d1fae5' },
          },
          screens: { xs: '375px' },
        }
      }
    }
  </script>
  {% if dir == 'rtl' %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Tajawal', sans-serif; }</style>
  {% else %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  {% endif %}
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  {% include "components/navbar.html" %}
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>
  {% include "components/footer.html" %}
  <script src="/static/js/app.js"></script>


  <script>
(function() {
  const modal = document.getElementById('hero-modal');
  const openBtn = document.getElementById('hero-cta-primary');
  const closeBtn = document.getElementById('hero-modal-close');
  const overlay = document.getElementById('hero-modal-overlay');

  if (!modal || !openBtn) return;

  function openModal() {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden'; // منع التمرير
    // تأثير ظهور
    requestAnimationFrame(() => {
      modal.querySelector('.relative').classList.add('scale-100', 'opacity-100');
    });
  }

  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.style.overflow = '';
  }

  // فتح النافذة
  openBtn.addEventListener('click', function(e) {
    e.preventDefault();
    openModal();
  });

  // إغلاق بزر X
  if (closeBtn) closeBtn.addEventListener('click', closeModal);

  // إغلاق بالنقر على الخلفية
  if (overlay) overlay.addEventListener('click', closeModal);

  // إغلاق بمفتاح Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
      closeModal();
    }
  });
})();
</script>

  
</body>
</html>
